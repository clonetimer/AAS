name: torch_like_pca_spe
label: PCA-SPE · 多参量残差
description: 源自 clonetimer，已适配 AAS V2 参数校验、训练评估和模型保存接口
class_path: detectors.torch_like_adapters.TorchLikePCASPEDetector
type: machine_learning
dependencies:
- numpy
min_training_samples: 4
config:
  n_components: 1
  min_std: 1.0e-08
  contamination: 0.05
config_schema:
- name: n_components
  label: 保留主成分个数
  type: int
  min: 1
  max: 7
  default: 1
- name: min_std
  label: 标准差下限
  type: float
  min: 1.0e-12
  max: 1.0
  default: 1.0e-08
- name: contamination
  label: 正常参考分位尾概率
  type: float
  min: 1.0e-05
  max: 0.49
  default: 0.05
decision_mode: score_threshold
decision_modes:
- score_threshold
