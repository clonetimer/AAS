name: torch_like_ewma
label: EWMA · 指数移动平均
description: 源自 clonetimer，已适配 AAS V2 参数校验、训练评估和模型保存接口
class_path: detectors.torch_like_adapters.TorchLikeEWMADetector
type: statistical
dependencies:
- numpy
min_training_samples: 2
config:
  alpha: 0.2
  control_limit: 3.0
  min_std: 1.0e-08
config_schema:
- name: alpha
  label: 平滑系数
  type: float
  min: 1.0e-05
  max: 1.0
  default: 0.2
- name: control_limit
  label: 控制限
  type: float
  min: 0.001
  max: 1000
  default: 3.0
- name: min_std
  label: 标准差下限
  type: float
  min: 1.0e-12
  max: 1.0
  default: 1.0e-08
decision_mode: score_threshold
decision_modes:
- score_threshold
